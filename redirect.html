<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection vers Scrumzy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1E1E1E;
            color: white;
            text-align: center;
            padding: 50px 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #2D2D2D;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-top: 0;
            color: #3DA5F5;
        }
        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }
        .button {
            display: inline-block;
            background-color: #3DA5F5;
            color: white;
            padding: 12px 24px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #2580C5;
        }
        .note {
            margin-top: 30px;
            font-size: 14px;
            color: #A0A0A0;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#3DA5F5">
            <path d="M0 0h24v24H0z" fill="none"/>
            <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 2v7h-4v-1h-4v1H6V4h12zM6 20v-7h4v1h4v-1h4v7H6z"/>
        </svg>
        
        <h1>Confirmation d'email Scrumzy</h1>
        <p>Merci d'avoir confirmé votre adresse email.</p>
        <p>Vous allez être redirigé vers l'application Scrumzy dans quelques secondes...</p>
        
        <a href="scrumzy://auth/callback" id="redirect-button" class="button">Ouvrir l'application</a>
        
        <p class="note">Si la redirection automatique ne fonctionne pas, veuillez cliquer sur le bouton ci-dessus.</p>
    </div>

    <script>
        // Récupérer les paramètres de l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || urlParams.get('access_token');
        
        // Construire l'URL deep link avec le token
        let deepLinkUrl = 'scrumzy://auth/callback';
        if (token) {
            deepLinkUrl += '?token=' + encodeURIComponent(token);
        }
        
        // Mettre à jour le lien du bouton
        document.getElementById('redirect-button').href = deepLinkUrl;
        
        // Redirection automatique après 2 secondes
        setTimeout(function() {
            window.location.href = deepLinkUrl;
        }, 2000);
    </script>
</body>
</html>
